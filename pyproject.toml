[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-remote"
version = "1.0.0"
description = "Single-user web console for downloading Bilibili media with yt-dlp"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "cryptography>=42,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "Pillow>=10.4,<14",
  "python-multipart>=0.0.9,<1",
  "qrcode[pil]>=7.4,<9",
  "uvicorn[standard]>=0.30,<1",
  "yt-dlp==2026.8.19",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "playwright>=1.55,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
include = ["bili_remote*"]

[tool.setuptools.package-data]
bili_remote = ["templates/*.html", "static/*"]
