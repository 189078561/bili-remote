name: Private Docker release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    if: github.event.repository.private && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the release image
        shell: bash
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9][a-z0-9.-]*)?$ ]]
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$GITHUB_REF_NAME" .

      - name: Test the two services with empty storage
        run: bash scripts/smoke_release.sh "$IMAGE:$GITHUB_REF_NAME"

      - name: Publish the private image and Compose bundle
        shell: bash
        run: |
          set -eu
          package="${GITHUB_REPOSITORY#*/}"
          package_api="/users/$GITHUB_REPOSITORY_OWNER/packages/container/${package,,}"
          if [[ "$(gh api "/repos/$GITHUB_REPOSITORY" --jq .owner.type)" = Organization ]]; then
            package_api="/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/${package,,}"
          fi
          if visibility=$(gh api "$package_api" --jq .visibility 2>"$RUNNER_TEMP/package-status"); then
            test "$visibility" = private
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/package-status"
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_REF_NAME"
          test "$(gh api "$package_api" --jq .visibility)" = private
          ref=$(docker image inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{index .RepoDigests 0}}')
          [[ "$ref" == "$IMAGE@sha256:"* ]]
          bundle=$(mktemp -d)
          cp docker-compose.yml "$bundle/compose.yaml"
          cp .env.example "$bundle/.env.example"
          echo "BILI_REMOTE_IMAGE=$ref" >> "$bundle/.env.example"
          cp deploy/install.md "$bundle/README.md"
          tar czf bili-remote-compose.tar.gz -C "$bundle" compose.yaml .env.example README.md
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" bili-remote-compose.tar.gz --verify-tag \
            --title "$GITHUB_REF_NAME" --notes "Linux amd64 · $ref" "${flags[@]}"
