<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bili Remote · 第二轮设计评审</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9ece7;color:#24362e;font:13px/1.5 system-ui,"Noto Sans CJK SC",sans-serif}button,select,a{font:inherit}button,select{cursor:pointer}header{background:#182d24;color:#edf3ec;padding:15px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}header strong{font-size:16px}header small{font-size:11px;color:#b8cbbf}header .status{margin-left:auto;border:1px solid #627d6c;border-radius:4px;padding:4px 9px;font-size:11px}nav{display:flex;gap:4px;padding:14px 24px 0;background:#f8faf6;flex-wrap:wrap}button{border:1px solid transparent;background:none;border-radius:6px;padding:8px 14px;color:inherit}button.active{background:#2e6653;color:white}.controls{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 24px;background:#f8faf6;border-bottom:1px solid #d3dcd3;flex-wrap:wrap}.controls label{display:flex;align-items:center;gap:9px}select{background:white;color:#24362e;border:1px solid #d4ddd4;padding:7px 9px;border-radius:6px;max-width:230px}.states{display:flex;gap:6px;flex-wrap:wrap}.states button{font-size:12px;padding:6px 10px;border-color:#d4ddd4}.states button.active{border-color:#2e6653}.viewports{display:flex;align-items:center;gap:8px}.canvas{padding:25px;display:flex;justify-content:center;overflow:hidden}.frame-shell{position:relative;box-shadow:0 8px 40px #23342f18;flex:none;background:white}.frame-shell.mobile{border:6px solid #21382b;border-radius:27px;overflow:hidden;box-sizing:content-box}iframe{border:0;display:block;transform-origin:top left;background:#f5f5f1}.caption{max-width:1100px;padding:0 24px 18px;margin:auto;font-size:12px;color:#53655b;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.caption a{color:#2e6653}.note{max-width:1100px;margin:0 auto 25px;padding:18px 24px;background:#f8faf6;border-radius:8px}.note h2{margin:0 0 6px;font-size:14px}.note p{font-size:12px;margin:0;color:#617167}.note code{font-size:11px}@media(max-width:600px){header{padding:12px 15px;gap:8px}header strong{font-size:14px}header .status{margin-left:0}nav{padding:10px 10px 0;gap:0}nav button{font-size:12px;padding:8px}.controls{padding:12px;gap:12px}.viewports{flex-wrap:wrap}.canvas{padding:16px 8px}.caption{padding:0 15px 15px}.note{margin:0 10px 20px;padding:14px}.states{gap:5px}.states button{font-size:11px;padding:5px 8px}}
</style></head><body><header><div><strong>Bili Remote / 设计评审 02</strong><br><small>独立高保真设计 · 原业务页面未修改</small></div><span class="status">待验收 · 未连接业务</span></header><nav id="pages" aria-label="设计页面"></nav><div class="controls"><div id="states" class="states" aria-label="关键状态"></div><div class="viewports"><select id="size" aria-label="画布尺寸"><option value="1440">桌面 · 1440px</option><option value="390">手机 · 390px</option></select><select id="theme" aria-label="设计主题"><option value="light">浅色</option><option value="dark">深色</option></select></div></div><div class="canvas"><div class="frame-shell"><iframe id="frame" title="独立页面设计，可操作预设交互"></iframe></div></div><div class="caption"><span id="description"></span><a id="original" target="_blank" rel="noopener">打开原尺寸页面 ↗</a></div><div class="note"><h2 id="design-title"></h2><p id="design-note"></p></div><script>
const catalog={home:{name:'首页',states:{default:'资源与任务',empty:'空资源'},note:'取消宣传区。最近资源直接进入工作台；手机优先露出进行中的任务和下一步动作。'},files:{name:'文件管理',states:{default:'未选择',selected:'批量选择',detail:'文件详情',empty:'空目录',conflict:'操作冲突'},note:'目录树只负责导航。文件列表占据主体；选择前没有批量禁用按钮，选择后出现相应操作条。'},download:{name:'B站下载',states:{idle:'未解析',parsed:'解析成功',select:'选集与画质',running:'下载中',complete:'已完成',failed:'失败'},note:'六个阶段分别设计。解析后确认内容，再逐集选择能力范围内的画质；任务按具体文件展示进度、失败原因和结果入口。'},settings:{name:'设置',states:{downloads:'下载设置',files:'目录设置',naming:'命名规则',subtitle:'副标题',tools:'截图与报告',connections:'图床与种子',general:'常规',dirty:'未保存'},note:'分类与配置检查器分工。常用值同行编辑，长文本和连接按需展开；只有存在修改时才出现保存栏。'},workbench:{name:'发种工作台',states:{default:'单工作区',match:'影视匹配',naming:'命名预览',conflict:'命名冲突',tools:'工具结果',screenshot:'截图工具',preview:'完整预览'},note:'同一资源贯穿身份确认、文件名差异、文案编辑和素材。完整预览按需展开，人工文本不依赖项目保存。'}};
let p='home',s='default';const qs=new URLSearchParams(location.search);if(catalog[qs.get('page')])p=qs.get('page');s=qs.get('state')||Object.keys(catalog[p].states)[0];const $=id=>document.getElementById(id);if(qs.get('width')==='390')$('size').value='390';
function resize(){let width=+$('size').value,height=width===390?844:900,available=document.querySelector('.canvas').clientWidth-(innerWidth<600?16:50),scale=Math.min(1,available/(width+(width===390?12:0)));let shell=document.querySelector('.frame-shell');shell.classList.toggle('mobile',width===390);shell.style.width=width*scale+'px';shell.style.height=height*scale+'px';$('frame').style.width=width+'px';$('frame').style.height=height+'px';$('frame').style.transform=`scale(${scale})`;$('description').textContent=`${catalog[p].name} / ${catalog[p].states[s]||'自选交互'} · ${width} × ${height} · 数据与产物均为设计样例`}
function render(){let c=catalog[p];$('pages').innerHTML=Object.entries(catalog).map(([key,v])=>`<button data-page="${key}" class="${key===p?'active':''}">${v.name}</button>`).join('');$('states').innerHTML=Object.entries(c.states).map(([key,v])=>`<button data-state="${key}" class="${key===s?'active':''}">${v}</button>`).join('');let url=`screen.html?page=${p}&state=${s}&theme=${$('theme').value}`;$('frame').src=url;$('original').href=url;$('design-title').textContent=c.name+' · 结构变化';$('design-note').textContent=c.note;resize()}
document.addEventListener('click',e=>{if(e.target.dataset.page){p=e.target.dataset.page;s=Object.keys(catalog[p].states)[0];render()}if(e.target.dataset.state){s=e.target.dataset.state;render()}});$('size').onchange=resize;$('theme').onchange=render;window.addEventListener('resize',resize);render();
</script></body></html>
