<section class="dv2" aria-label="B站下载工作台">
  <header class="dv2-header">
    <div><p class="dv2-eyebrow">BILIBILI DOWNLOAD</p><h1>B站下载</h1><p>粘贴链接、选择内容与画质，任务状态会自动更新。</p></div>
    <div class="dv2-account" aria-live="polite"><span class="dv2-dot" data-account-dot></span><div><strong>账号线路</strong><span data-account-status>正在读取登录状态…</span></div><div class="dv2-login-actions"><button type="button" data-login-web>Web 登录</button><button type="button" data-logout-web hidden>断开 Web</button><button type="button" data-login-tv>TV 登录</button><button type="button" data-logout-tv hidden>断开 TV</button></div></div>
  </header>
  <div class="dv2-layout">
    <section class="dv2-card dv2-create">
      <div class="dv2-card-title"><div><span class="dv2-step">01</span><h2>添加下载</h2></div><span data-parse-state aria-live="polite">等待解析</span></div>
      <form data-download-form>
        <label class="dv2-link-label" for="dv2-url">B站链接</label>
        <div class="dv2-link-row"><input id="dv2-url" type="url" required placeholder="粘贴视频、番剧或合集链接" autocomplete="url"><button type="button" data-parse>解析链接</button></div>
        <div class="dv2-inline-options"><label>下载线路<select data-mode><option value="web">Web 线路</option><option value="tv">TV 线路</option></select></label><p>沿用当前登录状态与线路权限</p></div>
        <div class="dv2-error" data-error role="alert" hidden></div>
        <div data-resolution hidden>
          <div class="dv2-media-summary"><strong data-title></strong><span data-summary></span></div>
          <div class="dv2-episodes" data-episodes hidden>
            <div class="dv2-section-heading"><div><h3>选择剧集</h3><span data-selected-count>已选 0 集</span></div><div class="dv2-select-actions"><button type="button" data-select-main>全选正片</button><button type="button" data-select-all>全选</button><button type="button" data-select-invert>反选</button><button type="button" data-select-none>清空</button></div></div>
            <div class="dv2-episode-list" data-episode-list></div>
          </div>
          <details class="dv2-advanced" open>
            <summary>画质与保存设置</summary>
            <div class="dv2-options-grid">
              <div class="dv2-quality-setting"><label>画质 / 编码<select data-format><option value="bv*+ba/b">最高可用 · 最佳音轨</option></select></label><button type="button" data-check-batch hidden>检测所选画质</button></div>
              <label>命名模板<input data-template required></label>
              <label class="dv2-output">保存子目录 <span>（可选）</span><span class="dv2-output-row"><input data-output placeholder="留空使用下载目录设置"><button type="button" data-pick-folder>浏览</button></span></label>
              <label class="dv2-checkbox" data-all-parts><input type="checkbox"><span>下载全部分P / 合集内容</span></label>
            </div>
            <p class="dv2-hint" data-format-hint>解析后列出可用画质；音轨沿用对应格式选择。</p>
          </details>
          <div class="dv2-submit-row"><span>下载后保留原文件名，可从任务进入工作台</span><button type="submit">加入下载队列</button></div>
        </div>
      </form>
    </section>
    <section class="dv2-card dv2-queue">
      <div class="dv2-card-title"><div><span class="dv2-step">02</span><h2>下载队列</h2></div><button type="button" class="dv2-refresh" data-refresh>刷新</button></div>
      <p class="dv2-notice" data-notice role="status" aria-live="polite">队列状态自动更新。</p>
      <div class="dv2-jobs" data-jobs><p class="dv2-empty">正在读取下载任务…</p></div>
    </section>
    <details class="dv2-card dv2-history"><summary><span>解析历史</span><span data-history-count></span></summary><div class="dv2-history-tools"><button type="button" data-history-refresh>刷新历史</button></div><div class="dv2-history-list" data-history><p class="dv2-empty">正在读取解析历史…</p></div></details>
  </div>
  <dialog data-log-dialog><form method="dialog"><div class="dv2-log-head"><strong>任务日志</strong><button aria-label="关闭">关闭</button></div><pre data-log-content></pre></form></dialog>
</section>
