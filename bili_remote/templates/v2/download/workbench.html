<section class="dv2" aria-label="B站下载工作台" data-stage="idle">
  <header class="dv2-header">
    <h1>B站下载</h1>
    <details class="dv2-account"><summary><span class="dv2-dot" data-account-dot></span><span data-account-status>读取账号状态…</span></summary><div class="dv2-login-actions"><button type="button" data-login-web>Web 登录</button><button type="button" data-logout-web hidden>断开 Web</button><button type="button" data-login-tv>TV 登录</button><button type="button" data-logout-tv hidden>断开 TV</button></div></details>
  </header>
  <div class="dv2-layout">
    <section class="dv2-create">
      <form data-download-form>
        <div class="dv2-link-row"><select data-mode aria-label="下载线路"><option value="web">Web</option><option value="tv">TV</option></select><input id="dv2-url" type="url" required aria-label="B站链接" placeholder="粘贴视频、番剧或合集链接" autocomplete="url"><button type="button" data-parse disabled>解析链接</button></div>
        <p class="dv2-parse-status" data-parse-state role="status"></p>
        <div class="dv2-error" data-error role="alert" hidden></div>
        <div class="dv2-idle" data-idle><h2>添加一个 B站链接</h2><p>支持单个视频、分P、番剧和合集。</p><div><span>粘贴链接</span><span>选择内容与可用画质</span><span>下载完成后处理资源</span></div></div>
        <div data-resolution class="dv2-resolution-grid" hidden>
          <div class="dv2-selection-content">
            <div class="dv2-media-summary"><div class="dv2-cover-fallback" aria-hidden="true"><svg class="ws-icon"><use href="/static/v2/shared/icons.svg#film"/></svg></div><img class="dv2-cover" data-cover alt="视频封面" referrerpolicy="no-referrer" hidden><div><h2 data-title></h2><p data-summary></p></div></div>
            <div class="dv2-section-heading" data-episode-heading hidden>
              <button type="button" class="dv2-episode-toggle" data-episode-toggle aria-expanded="false" aria-controls="dv2-episodes"><strong>解析列表</strong><span data-selected-count>已选 0 集</span></button>
            </div>
            <div class="dv2-quality-section"><div class="dv2-quality-setting"><label>统一画质<select data-format><option value="bv*+ba/b">最高可用 · 最佳音轨</option></select></label></div><p class="dv2-hint" data-format-hint>画质信息来自解析结果。</p></div>
            <section class="dv2-episodes" id="dv2-episodes" data-episodes hidden>
              <div class="dv2-picker-toolbar">
                <div class="dv2-categories" data-episode-categories role="group" aria-label="内容分类"></div>
                <div class="dv2-picker-actions">
                  <div class="dv2-sort" role="group" aria-label="当前分类排序"><button type="button" data-sort="asc" aria-pressed="false">正序 ↑</button><button type="button" data-sort="desc" aria-pressed="false">倒序 ↓</button></div>
                  <button type="button" data-select-all aria-pressed="false">全选</button>
                </div>
              </div>
              <div class="dv2-picker-controls">
                <div class="dv2-ranges" data-episode-ranges role="group" aria-label="条目范围"></div>
                <div class="dv2-select-actions"><details><summary>更多</summary><div><button type="button" data-select-none>清空全部</button><button type="button" data-select-invert>反选全部</button><button type="button" data-check-batch hidden>检测所选画质</button></div></details></div>
              </div>
              <div class="dv2-episode-list" data-episode-list></div>
              <div class="dv2-episode-detail" data-episode-detail hidden></div>
            </section>
            <section class="dv2-naming" aria-labelledby="dv2-naming-title">
              <h3 id="dv2-naming-title">文件命名</h3>
              <div class="dv2-naming-controls">
                <label>命名方式<select data-naming-mode><option value="smart">初步整理</option><option value="source">保留来源命名</option></select></label>
                <label>作品名称<input data-naming-name maxlength="240" placeholder="按解析结果命名"></label>
                <label data-naming-episode-label hidden>调整哪一集<select data-naming-episode></select></label>
                <label data-naming-kind-label>编号类型<select data-naming-kind><option value="episode">连续集号</option><option value="part">分 P</option></select></label>
                <label data-naming-number-label>编号<input data-naming-number type="number" min="1" max="99999" step="1" placeholder="自动识别"></label>
              </div>
              <p data-naming-facts class="dv2-hint"></p>
              <div data-naming-preview class="dv2-naming-preview" aria-live="polite"></div>
              <p class="dv2-hint">扩展名以完工后的实际容器为准。遇到同名文件时保留原文件，并为本次下载追加区分标记。</p>
            </section>
          </div>
          <aside class="dv2-selection-summary"><h3>本次选择</h3><dl><dt>内容</dt><dd data-summary-count>—</dd><dt>画质</dt><dd data-summary-quality>最高可用</dd><dt>保存到</dt><dd data-summary-output>下载目录</dd></dl>
            <details class="dv2-advanced"><summary>目录与下载选项</summary><div class="dv2-options-grid"><label>来源命名模板<input data-template></label><label class="dv2-output">保存子目录<span class="dv2-output-row"><input data-output placeholder="使用下载目录"><button type="button" data-pick-folder>浏览</button></span></label><label class="dv2-checkbox" data-all-parts><input type="checkbox"><span>下载全部分P / 合集内容</span></label></div></details>
            <div class="dv2-submit-row"><span data-submit-summary>仅使用本次选择</span><button type="submit">开始下载</button></div><p class="dv2-hint">完成后可用当前文件进入发种工作台进行 PT 命名。</p>
          </aside>
        </div>
      </form>
    </section>
    <section class="dv2-queue">
      <div class="dv2-card-title"><div><h2>下载任务</h2><span data-queue-count></span></div><button type="button" class="dv2-refresh" data-refresh>刷新</button></div>
      <p class="dv2-notice" data-notice role="status">队列状态自动更新。</p><div class="dv2-jobs" data-jobs><p class="dv2-empty">读取下载任务…</p></div>
    </section>
    <details class="dv2-history"><summary><span>下载历史</span><span data-download-history-count></span></summary><p class="dv2-error" data-download-history-error role="alert" hidden></p><div class="dv2-history-list" data-download-history><p class="dv2-empty">读取下载历史…</p></div></details>
    <details class="dv2-history"><summary><span>解析记录</span><span data-history-count></span></summary><div class="dv2-history-tools"><button type="button" data-history-refresh>刷新记录</button></div><p class="dv2-error" data-parse-history-error role="alert" hidden></p><div class="dv2-history-list" data-history><p class="dv2-empty">读取解析记录…</p></div></details>
  </div>
  <dialog data-log-dialog aria-labelledby="dv2-log-title"><div class="dv2-log-shell"><div class="dv2-log-head"><strong id="dv2-log-title" data-log-title>任务日志</strong><button type="button" data-log-close aria-label="关闭日志">关闭</button></div><pre class="dv2-log-content" data-log-content tabindex="0"></pre></div></dialog>
</section>
