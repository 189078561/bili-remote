<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/styles.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/ui.css?v={{ asset_version }}">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel">
      <div class="brand-mark">BR</div>
      <p class="eyebrow">PRIVATE MEDIA CONSOLE</p>
      <h1>{{ app_name }}</h1>
      <p class="muted">管理 B 站下载任务、番剧选集与解析历史。请先登录控制台。</p>
      <form id="login-form" class="stack">
        <label>
          用户名
          <input id="username" name="username" autocomplete="username" value="admin" required>
        </label>
        <label>
          密码
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="button primary wide" type="submit">进入控制台</button>
      </form>
    </section>
  </main>
  <script>
    const form = document.querySelector("#login-form");
    const error = document.querySelector("#login-error");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      const button = form.querySelector("button");
      button.disabled = true;
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            username: document.querySelector("#username").value,
            password: document.querySelector("#password").value
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "登录失败");
        window.location.assign("/");
      } catch (err) {
        error.textContent = err.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
